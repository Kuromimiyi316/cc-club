<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>排单工具</title>
<style>
*{box-sizing:border-box;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;margin:0;padding:0}
body{background:#f4f7fc;padding:20px;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.app{width:100%;max-width:1380px;background:#fff;border-radius:28px;box-shadow:0 15px 35px rgba(0,20,40,.12);padding:24px 28px 32px;margin:0 auto}
.title-row{text-align:center;margin-bottom:16px}
.title-row h1{font-size:2rem;font-weight:600;color:#1a2b4c;letter-spacing:-.3px;display:inline-flex;align-items:center;gap:10px}
.toolbar-row{display:flex;justify-content:center;align-items:center;gap:12px;margin-bottom:24px;padding-bottom:18px;border-bottom:1px solid #dae2ed;flex-wrap:wrap}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search-box{display:flex;align-items:center;background:#fff;border:1px solid #cfddee;border-radius:40px;padding:0 6px 0 16px;transition:.15s;min-width:260px}
.search-box:focus-within{border-color:#2a86c7;box-shadow:0 0 0 3px rgba(42,134,199,.15)}
.search-box input{border:none;outline:none;padding:9px 0;font-size:.9rem;width:100%;background:transparent;color:#1a2b4c}
.search-box input::placeholder{color:#9aafc7}
.search-box button{background:none;border:none;cursor:pointer;padding:6px 10px;font-size:1.1rem;color:#8a9bb2;line-height:1}
.search-box button:hover{color:#1e3a5f}
.board{display:flex;flex-direction:column;gap:24px}
.column{background:#f9fbfe;border-radius:20px;padding:14px 16px 18px;border:1px solid #e3eaf2;box-shadow:0 2px 6px rgba(0,0,0,.02)}
.column-header{display:flex;align-items:center;margin-bottom:14px;padding:0 4px}
.column-header h2{font-size:1.2rem;font-weight:600;letter-spacing:-.2px;display:flex;align-items:center;gap:8px}
.column-header .count{background:#fff;border-radius:40px;padding:2px 12px;font-size:.8rem;font-weight:500;color:#1e3a5f;border:1px solid #cddaea;margin-left:10px}
.pending .column-header h2{color:#b55a1a}
.progress .column-header h2{color:#1e6f9f}
.done .column-header h2{color:#2e7d5e}
.abandoned .column-header h2{color:#8b5e3c}
.card-list{display:flex;flex-direction:column;gap:14px;min-height:80px}
.card{background:#fff;border-radius:16px;padding:18px 20px;box-shadow:0 2px 10px rgba(0,20,30,.05);border-left:5px solid #e68a2e;display:flex;gap:22px;align-items:stretch;border:1px solid #e8eef7;border-left-width:5px;position:relative}
.card.search-highlight,.list-item.search-highlight{outline:3px solid #f5b042;outline-offset:1px;animation:highlightPulse 1s ease-in-out 2}
@keyframes highlightPulse{0%{outline-color:#f5b042}50%{outline-color:#ffd966}100%{outline-color:#f5b042}}
.card.urgent{border:2px solid #e63946;border-left-width:5px;border-left-color:#e63946;background:#fff9f9;box-shadow:0 0 0 3px rgba(230,57,70,.12);animation:urgentPulse 1.5s infinite alternate}
@keyframes urgentPulse{from{box-shadow:0 0 0 2px rgba(230,57,70,.1)}to{box-shadow:0 0 0 5px rgba(230,57,70,.18)}}
.card.urgent .order-id{background:#ffe0e0;color:#a4161a}
.urgent-badge{font-size:.65rem;font-weight:700;background:#e63946;color:#fff;padding:2px 8px;border-radius:30px;letter-spacing:.4px;display:inline-flex;align-items:center;gap:3px;margin-left:6px;white-space:nowrap}
.card-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.card-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.order-id-group{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.order-id{font-weight:700;font-size:1rem;color:#1e2f44;background:#f0f5fc;padding:3px 12px;border-radius:30px;display:inline-block}
.status-badge{font-size:.7rem;font-weight:600;padding:3px 12px;border-radius:40px;background:#eef3fa;color:#3b587c;text-transform:uppercase;white-space:nowrap}
.status-badge.pending-badge{background:#fff0e0;color:#b55a1a}
.info-row{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:.88rem;color:#2d4059}
.info-row .info-item{display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.info-row .info-label{font-weight:500;color:#6f85a3;font-size:.78rem}
.info-row .info-value{font-weight:500;color:#1a2b4c}
.info-row .info-value.type{max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.info-row .info-value.note{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#5b6f89;font-style:italic}
.boss-status{display:inline-flex;align-items:center;gap:4px;background:#f2f7ff;padding:3px 10px;border-radius:40px;font-size:.8rem}
.status-toggle{display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
.status-dot{width:10px;height:10px;border-radius:50%;background:#b0c4de;transition:background .15s}
.status-dot.waiting{background:#f5b042;box-shadow:0 0 0 2px rgba(245,176,66,.2)}
.status-dot.offline{background:#a0b2c8}
.status-dot.playing{background:#2a86c7;box-shadow:0 0 0 2px rgba(42,134,199,.2)}
.status-dot.finished{background:#3b9b7a}
.status-label{font-weight:500;color:#2d4059;font-size:.78rem}
.assignee-row{display:flex;flex-wrap:wrap;align-items:center;gap:14px;background:#f6faff;border-radius:14px;padding:10px 14px}
.assignee-item{display:flex;align-items:center;gap:8px;flex:1 1 180px}
.assignee-item label{font-size:.72rem;font-weight:600;color:#5f7392;text-transform:uppercase;white-space:nowrap}
.assignee-input{border:1px solid #cfddee;border-radius:30px;padding:7px 14px;font-size:.85rem;background:#fff;transition:.15s;width:100%;font-weight:500;color:#1a2b4c}
.assignee-input:focus{outline:none;border-color:#2a86c7;box-shadow:0 0 0 3px rgba(42,134,199,.12)}
.assignee-input::placeholder{color:#9aafc7;font-weight:400}
.card-side{display:flex;flex-direction:column;gap:8px;justify-content:center;align-items:stretch;min-width:130px;padding-left:18px;border-left:1px dashed #d7e2f0}
.btn{border:none;background:#f0f5fc;padding:7px 16px;border-radius:30px;font-size:.76rem;font-weight:600;color:#1e3a5f;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;justify-content:center;border:1px solid transparent;white-space:nowrap;text-align:center}
.btn:hover{background:#e1eaf5}
.btn-primary{background:#1e3a5f;color:#fff}
.btn-primary:hover{background:#14304f}
.btn-outline{background:#fff;border:1px solid #cfddee}
.btn-outline:hover{background:#f2f8ff}
.btn-done{background:#2e7d5e;color:#fff}
.btn-done:hover{background:#1f6349}
.btn-edit{background:#eef3fa;color:#1e3a5f}
.btn-urgent{background:#e63946;color:#fff}
.btn-urgent:hover{background:#b71c2c}
.btn-urgent.active{background:#b71c2c;border-color:#a4161a}
.btn-abandon{background:#f0f0f0;color:#6b5b4f}
.btn-abandon:hover{background:#e0e0e0}
.btn-reassign{background:#2e7d5e;color:#fff}
.btn-reassign:hover{background:#1f6349}
.btn-transfer{background:#8b5e3c;color:#fff}
.btn-transfer:hover{background:#6e4a2f}
.btn-view-transfer{background:#f0f5fc;color:#8b5e3c;border:1px solid #d9c9bc}
.btn-view-transfer:hover{background:#fdf6f0}
.btn-danger{background:#e63946;color:#fff}
.btn-danger:hover{background:#b71c2c}
.btn-delete{background:#fff0f0;color:#c0392b;border:1px solid #f5c6c6}
.btn-delete:hover{background:#ffe0e0}
.btn-dispatch{background:#2a86c7;color:#fff}
.btn-dispatch:hover{background:#1e6f9f}
.empty-state{color:#97abc2;font-size:.85rem;padding:20px 10px;text-align:center;background:#ffffffc7;border-radius:14px;border:1px dashed #cddaea}
.list-view{display:flex;flex-direction:column;gap:8px}
.list-item{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:10px;background:#fff;border-radius:12px;padding:12px 16px;border:1px solid #e3eaf2;font-size:.85rem;transition:.15s}
.list-item.progress-item{border-left:4px solid #2a86c7}
.list-item.progress-item:hover{background:#f7fbfe;border-color:#c8ddf0}
.list-item.done-item{border-left:4px solid #3b9b7a}
.list-item.done-item:hover{background:#f9fdfb;border-color:#c8ddd4}
.list-item.abandoned-item{border-left:4px solid #b8a99a}
.list-item.abandoned-item:hover{background:#fdfbf9;border-color:#d0c5b8}
.list-info{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.list-info .list-row{display:flex;align-items:center;flex-wrap:wrap;gap:6px 16px}
.list-info .list-id{font-weight:700;background:#f0f5fc;padding:2px 10px;border-radius:20px;font-size:.85rem;color:#1e2f44}
.list-item.progress-item .list-id{background:#e1f0fe;color:#1e6f9f}
.list-item.done-item .list-id{background:#e1f5ec;color:#1e6f4a}
.list-item.abandoned-item .list-id{background:#f5f0eb;color:#5e4e42}
.list-info .list-field{display:flex;align-items:baseline;gap:4px;color:#6b7a8e}
.list-info .list-field strong{font-weight:500;color:#8a9bb2;font-size:.7rem;text-transform:uppercase}
.list-info .list-field span{font-weight:500;color:#2d4059}
.list-info .list-field .list-type{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.list-info .list-field .list-boss{font-weight:700}
.list-info .list-field .list-boss-status{display:inline-flex;align-items:center;gap:4px;background:#f2f7ff;padding:1px 8px;border-radius:40px;font-size:.78rem}
.list-info .list-field .list-boss-status .status-dot{width:8px;height:8px}
.list-actions{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;align-self:center}
.transfer-inline{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;background:#fdf6f0;border-radius:10px;padding:6px 12px;font-size:.78rem;color:#5e4e42;border-left:3px solid #8b5e3c}
.transfer-inline .transfer-label{font-weight:600;color:#8b5e3c;white-space:nowrap}
.transfer-inline .transfer-group-tag{display:inline-flex;align-items:center;gap:4px;background:#fff;border:1px solid #e8ddd4;padding:2px 10px;border-radius:20px;white-space:nowrap}
.transfer-inline .transfer-group-tag .fee{color:#c0392b;font-weight:600}
.transfer-inline .transfer-group-tag .desc{color:#8a7a6a;font-style:italic}
.transfer-inline .transfer-total{font-weight:700;color:#c0392b;background:#fff0f0;padding:2px 10px;border-radius:20px;border:1px solid #f5c6c6}
.footer{margin-top:28px;text-align:center;font-size:.75rem;color:#99aec9}
.panel-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,20,40,.3);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:1000}
.panel{background:#fff;border-radius:28px;width:90%;max-width:680px;max-height:90vh;overflow-y:auto;padding:28px 32px;box-shadow:0 30px 60px rgba(0,20,40,.3);display:flex;flex-direction:column;gap:16px}
.panel h3{font-size:1.4rem;font-weight:600;color:#1a2b4c;display:flex;justify-content:space-between;align-items:center}
.panel h3 .close-panel{background:none;border:none;font-size:1.6rem;cursor:pointer;color:#8a9bb2;padding:0 8px;line-height:1}
.panel .field{display:flex;flex-direction:column;gap:4px}
.panel .field label{font-size:.8rem;font-weight:600;color:#5f7392;text-transform:uppercase;letter-spacing:.3px}
.panel .field input,.panel .field textarea{border:1px solid #cfddee;border-radius:12px;padding:10px 14px;font-size:.95rem;font-family:inherit;background:#fff;transition:.15s}
.panel .field input:focus,.panel .field textarea:focus{outline:none;border-color:#2a86c7;box-shadow:0 0 0 3px rgba(42,134,199,.15)}
.panel .field textarea{min-height:70px;resize:vertical}
.panel .row-2col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.panel .actions-panel{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}
.paste-area{display:flex;flex-direction:column;gap:6px;background:#f6faff;padding:14px 16px;border-radius:16px;border:1px dashed #cddaea}
.paste-area label{font-size:.8rem;font-weight:600;color:#5f7392;text-transform:uppercase}
.paste-area textarea{border:1px solid #cfddee;border-radius:12px;padding:10px 14px;font-size:.85rem;font-family:'SF Mono','Menlo',monospace;min-height:110px;background:#fff;resize:vertical}
.paste-area .hint{font-size:.75rem;color:#8a9bb2}
.paste-area .btn-paste-apply{align-self:flex-start;margin-top:4px}
.panel .checkbox-row{display:flex;align-items:center;gap:8px;font-size:.9rem;color:#2d4059}
.transfer-group-list{display:flex;flex-direction:column;gap:12px}
.transfer-group{background:#f9fbfe;border:1px solid #e3eaf2;border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;position:relative}
.transfer-group .group-header{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;font-weight:600;color:#8b5e3c}
.transfer-group .group-header .group-remove{background:none;border:none;color:#c0392b;cursor:pointer;font-size:1rem;padding:0 4px}
.transfer-group .group-inputs{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.transfer-group .group-inputs input{border:1px solid #cfddee;border-radius:8px;padding:6px 10px;font-size:.82rem;width:90px;background:#fff}
.transfer-group .group-inputs input:focus{outline:none;border-color:#8b5e3c;box-shadow:0 0 0 2px rgba(139,94,60,.15)}
.transfer-group .group-inputs .fee-input{width:100px}
.transfer-group .group-inputs .count-input{width:60px;background:#f0f5fc;font-weight:600;color:#1e3a5f;text-align:center}
.transfer-group .group-inputs .desc-input{flex:1;min-width:140px;width:auto}
.transfer-group .group-inputs label{font-size:.7rem;color:#8a9bb2;font-weight:500}
.group-subtotal{font-size:.8rem;font-weight:600;color:#c0392b;background:#fff0f0;padding:4px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:4px;margin-top:2px}
.transfer-total-bar{background:#fdf6f0;border-radius:14px;padding:12px 16px;font-size:.9rem;font-weight:600;color:#8b5e3c;display:flex;justify-content:space-between;align-items:center;border:1px solid #e8ddd4}
.transfer-total-bar .total-amount{font-size:1.15rem;font-weight:800;color:#c0392b}
.add-group-btn{align-self:flex-start;margin-top:4px}
.dispatch-btn-wrap{margin-top:6px;padding-top:12px;border-top:1px dashed #d7e2f0;display:flex;flex-direction:column;gap:8px}
.dispatch-btn-wrap .dispatch-hint{font-size:.75rem;color:#8a9bb2}
.dispatch-preview{background:#f8fafc;border:1px solid #cfddee;border-radius:12px;padding:12px 14px;font-size:.82rem;line-height:1.9;color:#1a2b4c;font-family:'SF Mono','Menlo',monospace;white-space:pre-wrap;word-break:break-all}
.transfer-record-display{background:#fdf6f0;border-radius:12px;padding:14px 18px;font-size:.85rem;line-height:1.9;color:#4a3a2e;border-left:4px solid #8b5e3c}
.transfer-record-display .group-line{padding:4px 0;border-bottom:1px dashed #e8ddd4}
.transfer-record-display .group-line:last-child{border-bottom:none}
.transfer-record-display .group-line .group-label{font-weight:600;color:#8b5e3c}
.transfer-record-display .fee-text{color:#c0392b;font-weight:500}
.transfer-record-display .desc-text{color:#6b5b4f;font-style:italic}
.transfer-record-display .record-total{margin-top:10px;padding-top:10px;border-top:2px solid #e8ddd4;font-weight:700;color:#c0392b;font-size:.95rem;text-align:right}
.export-urgent-highlight{background:#fff5f5;border-left:4px solid #e63946;padding:4px 8px;margin:2px 0;border-radius:4px;font-weight:600}
.export-normal-highlight{background:#f5fdf9;border-left:4px solid #3b9b7a;padding:4px 8px;margin:2px 0;border-radius:4px;font-weight:600}
@media(max-width:820px){.card{flex-direction:column;gap:14px}.card-side{flex-direction:row;flex-wrap:wrap;border-left:none;border-top:1px dashed #d7e2f0;padding-left:0;padding-top:12px;justify-content:flex-start}.card-side .btn{flex:1 1 auto}}
@media(max-width:680px){.info-row{flex-direction:column;gap:4px}.info-row .info-value.type{max-width:100%;white-space:normal}.info-row .info-value.note{max-width:100%;white-space:normal}.assignee-item{flex:1 1 100%}.app{padding:16px}.panel{padding:20px}.search-box{min-width:180px}.list-item{flex-direction:column;align-items:flex-start}.list-actions{align-self:flex-end}.transfer-group .group-inputs input{width:70px}}
</style>
</head>
<body>
<div class="app">
    <div class="title-row"><h1>📋 排单工具</h1></div>

    <div class="toolbar-row">
        <div class="search-box">
            <input type="text" id="search-input" placeholder="搜索订单号 / 老板 / 类型...">
            <button id="search-clear" title="清除搜索">✕</button>
        </div>
        <div class="toolbar">
            <button class="btn btn-primary" id="btn-create">+ 创建订单</button>
            <button class="btn btn-outline" id="btn-export">📤 一键导出</button>
            <button class="btn btn-danger" id="btn-reset">🗑 重置全部</button>
        </div>
    </div>

    <div class="board">
        <div class="column pending" id="col-pending">
            <div class="column-header"><h2>⏳ 待接单 <span class="count" id="pending-count">0</span></h2></div>
            <div class="card-list" id="pending-list"></div>
        </div>
        <div class="column progress" id="col-progress">
            <div class="column-header"><h2>⚙️ 正在进行 <span class="count" id="progress-count">0</span></h2></div>
            <div class="list-view" id="progress-list"></div>
        </div>
        <div class="column done" id="col-done">
            <div class="column-header"><h2>✅ 已结束 <span class="count" id="done-count">0</span></h2></div>
            <div class="list-view" id="done-list"></div>
        </div>
        <div class="column abandoned" id="col-abandoned">
            <div class="column-header"><h2>🚫 弃单 <span class="count" id="abandoned-count">0</span></h2></div>
            <div class="list-view" id="abandoned-list"></div>
        </div>
    </div>
    <div class="footer">© Kuromimiyi 小米 版权所有</div>
</div>

<div id="panel-container"></div>
<div id="export-container"></div>

<script>
/* ============ 数据层 ============ */
const STORAGE_KEY = 'paidan_orders_v11_dispatch';

function loadOrders(){
    try{
        const raw=localStorage.getItem(STORAGE_KEY);
        if(raw){
            const parsed=JSON.parse(raw);
            if(Array.isArray(parsed)) return parsed.map(o=>({...o,transferGroups:(o.transferGroups||[]).map(g=>({...g,count:g.count||'1'}))}));
        }
    }catch(e){console.warn('读取失败',e);}
    try{localStorage.setItem(STORAGE_KEY,'[]');}catch(e){}
    return [];
}
function saveOrders(){
    try{localStorage.setItem(STORAGE_KEY,JSON.stringify(orders));}
    catch(e){console.warn('保存失败',e);}
}

let orders=loadOrders();
let editingOrderId=null;
let currentSearchTerm='';

/* ============ DOM ============ */
const pendingList=document.getElementById('pending-list');
const progressList=document.getElementById('progress-list');
const doneList=document.getElementById('done-list');
const abandonedList=document.getElementById('abandoned-list');
const pendingCount=document.getElementById('pending-count');
const progressCount=document.getElementById('progress-count');
const doneCount=document.getElementById('done-count');
const abandonedCount=document.getElementById('abandoned-count');
const panelContainer=document.getElementById('panel-container');
const exportContainer=document.getElementById('export-container');
const searchInput=document.getElementById('search-input');
const searchClear=document.getElementById('search-clear');

/* ============ 工具 ============ */
function toNumber(v){const n=parseFloat(v);return isNaN(n)?0:n;}
function groupSubtotal(g){return toNumber(g.count)*toNumber(g.fee);}
function orderTransferTotal(order){
    if(!order.transferGroups) return 0;
    return order.transferGroups.reduce((sum,g)=>sum+groupSubtotal(g),0);
}
function fmtMoney(n){return Number.isInteger(n)?String(n):n.toFixed(2);}

function autoCountFromPlayers(player1,player2){
    const p1=(player1||'').trim();
    const p2=(player2||'').trim();
    if(p1&&p2) return '2';
    if(p1||p2) return '1';
    return '1';
}

/* ★ 修复：保留 1118-34 完整编号，只在末尾追加/替换 -n */
function buildDispatchOrderId(baseId, groupCount){
    const n = groupCount || 1;
    let id = String(baseId || '').trim();
    /* 如果已经是 “xxx-数字” 结尾，且去掉最后一段后仍包含 “-”，
       说明最后一段是之前追加的派单条后缀，需要先去掉它 */
    const m = id.match(/^(.*)-(\d+)$/);
    if (m && m[1] && m[1].includes('-')) {
        id = m[1];
    }
    return `${id}-${n}`;
}

function sortOrders(list){
    return [...list].sort((a,b)=>{
        if(a.urgent&&!b.urgent) return -1;
        if(!a.urgent&&b.urgent) return 1;
        return (b.createTime||'').localeCompare(a.createTime||'');
    });
}
function matchesSearch(order){
    if(!currentSearchTerm) return true;
    const term=currentSearchTerm.toLowerCase();
    return order.id.toLowerCase().includes(term)||order.bossNickname.toLowerCase().includes(term)||order.type.toLowerCase().includes(term)||order.customerService.toLowerCase().includes(term);
}
function formatDate(date){
    const y=date.getFullYear();
    const m=String(date.getMonth()+1).padStart(2,'0');
    const d=String(date.getDate()).padStart(2,'0');
    const h=String(date.getHours()).padStart(2,'0');
    const min=String(date.getMinutes()).padStart(2,'0');
    const s=String(date.getSeconds()).padStart(2,'0');
    return `${y}-${m}-${d} ${h}:${min}:${s}`;
}
function generateNewId(){
    let maxNum=0;
    orders.forEach(o=>{
        const match=o.id.match(/(\d+)-(\d+)/);
        if(match){const num=parseInt(match[2]);if(num>maxNum)maxNum=num;}
    });
    return `1118-${maxNum+1}`;
}

function renderTransferInline(groups){
    if(!groups||groups.length===0) return '';
    const tags=groups.map((g,i)=>{
        const names=[g.player1,g.player2].filter(Boolean).join(' & ')||'—';
        const count=toNumber(g.count)||1;
        const fee=toNumber(g.fee);
        const subtotal=count*fee;
        const feeHtml=fee>0
            ? `<span class="fee">${count}人×${fmtMoney(fee)}=${fmtMoney(subtotal)}</span>`
            : '<span class="fee" style="color:#8a9bb2;font-weight:400;">无炸单费</span>';
        const desc=g.desc?`<span class="desc">${g.desc}</span>`:'';
        return `<span class="transfer-group-tag">第${i+1}组：${names} ${feeHtml} ${desc}</span>`;
    }).join('');
    const total=groups.reduce((s,g)=>s+groupSubtotal(g),0);
    const totalHtml=total>0?`<span class="transfer-total">炸单费合计：${fmtMoney(total)}</span>`:'';
    return `<div class="transfer-inline"><span class="transfer-label">🔁 转单记录</span>${tags}${totalHtml}</div>`;
}

/* ============ 渲染 ============ */
function renderAll(){
    pendingList.innerHTML='';
    progressList.innerHTML='';
    doneList.innerHTML='';
    abandonedList.innerHTML='';

    const allPending=sortOrders(orders.filter(o=>o.status==='pending'));
    const allProgress=sortOrders(orders.filter(o=>o.status==='progress'));
    const allDone=sortOrders(orders.filter(o=>o.status==='done'));
    const allAbandoned=orders.filter(o=>o.status==='abandoned');

    const pendingOrders=allPending.filter(matchesSearch);
    const progressOrders=allProgress.filter(matchesSearch);
    const doneOrders=allDone.filter(matchesSearch);
    const abandonedOrders=allAbandoned.filter(matchesSearch);

    pendingCount.textContent=allPending.length;
    progressCount.textContent=allProgress.length;
    doneCount.textContent=allDone.length;
    abandonedCount.textContent=allAbandoned.length;

    pendingOrders.forEach(o=>pendingList.appendChild(createPendingCard(o)));
    progressOrders.forEach(o=>progressList.appendChild(createProgressItem(o)));
    doneOrders.forEach(o=>doneList.appendChild(createDoneItem(o)));
    abandonedOrders.forEach(o=>abandonedList.appendChild(createAbandonedItem(o)));

    if(pendingOrders.length===0) pendingList.innerHTML=currentSearchTerm?'<div class="empty-state">没有匹配的待接单</div>':'<div class="empty-state">暂无待接单</div>';
    if(progressOrders.length===0) progressList.innerHTML=currentSearchTerm?'<div class="empty-state">没有匹配的进行中订单</div>':'<div class="empty-state">暂无进行中订单</div>';

/* ============ 全局事件委托 ============ */
document.addEventListener('click',function(e){
    const target=e.target.closest('[data-action]');
    if(!target) return;

    const action=target.dataset.action;
    const container=target.closest('.card, .list-item');
    if(!container) return;

    const orderId=container.dataset.orderId;
    const order=orders.find(o=>o.id===orderId);
    if(!order) return;

    e.stopPropagation();

    if(action==='toggle-boss'){
        const card=target.closest('.card');
        if(card){
            const i1=card.querySelector('[data-assignee="1"]');
            const i2=card.querySelector('[data-assignee="2"]');
            if(i1) order.assignee1=i1.value.trim();
            if(i2) order.assignee2=i2.value.trim();
        }
        order.bossWaiting=!order.bossWaiting;
        saveOrders();
        renderAll();
        return;
    }

    if(action==='toggle-urgent'){
        const card=target.closest('.card');
        if(card){
            const i1=card.querySelector('[data-assignee="1"]');
            const i2=card.querySelector('[data-assignee="2"]');
            if(i1) order.assignee1=i1.value.trim();
            if(i2) order.assignee2=i2.value.trim();
        }
        order.urgent=!order.urgent;
        saveOrders();
        renderAll();
        return;
    }

    if(action==='move-to-progress'){
        const card=target.closest('.card');
        if(card){
            const i1=card.querySelector('[data-assignee="1"]');
            const i2=card.querySelector('[data-assignee="2"]');
            if(i1) order.assignee1=i1.value.trim();
            if(i2) order.assignee2=i2.value.trim();
        }
        order.status='progress';
        if(!order.transferGroups||order.transferGroups.length===0){
            const autoCount=autoCountFromPlayers(order.assignee1,order.assignee2);
            order.transferGroups=[{player1:order.assignee1||'',player2:order.assignee2||'',count:autoCount,fee:'0',desc:'首组'}];
        }
        saveOrders();
        renderAll();
        return;
    }

    if(action==='abandon'){
        const card=target.closest('.card');
        if(card){
            const i1=card.querySelector('[data-assignee="1"]');
            const i2=card.querySelector('[data-assignee="2"]');
            if(i1) order.assignee1=i1.value.trim();
            if(i2) order.assignee2=i2.value.trim();
        }
        if(confirm('确定要弃单吗？弃单后将进入弃单板块。')){
            order.status='abandoned';
            order.urgent=false;
            saveOrders();
            renderAll();
        }
        return;
    }

    if(action==='edit-order'){
        const card=target.closest('.card');
        if(card){
            const i1=card.querySelector('[data-assignee="1"]');
            const i2=card.querySelector('[data-assignee="2"]');
            if(i1) order.assignee1=i1.value.trim();
            if(i2) order.assignee2=i2.value.trim();
            saveOrders();
        }
        openEditPanel(orderId);
        return;
    }

    if(action==='transfer'){openTransferPanel(orderId);return;}

    if(action==='move-to-done'){
        order.status='done';
        order.bossFinished=true;
        saveOrders();
        renderAll();
        return;
    }

    if(action==='move-to-pending'){
        order.status='pending';
        order.bossFinished=false;
        order.bossWaiting=true;
        saveOrders();
        renderAll();
        return;
    }

    if(action==='view-transfer'){openViewTransferPanel(orderId);return;}

    if(action==='reassign'){
        if(confirm('确定要重新派单吗？订单将回到待接单板块。')){
            order.status='pending';
            order.bossFinished=false;
            order.bossWaiting=true;
            order.assignee1='';
            order.assignee2='';
            order.urgent=false;
            order.transferGroups=[];
            order.createTime=formatDate(new Date());
            saveOrders();
            renderAll();
        }
        return;
    }

    if(action==='delete-order'){
        if(confirm(`确定要永久删除订单 ${order.id} 吗？此操作不可恢复。`)){
            orders=orders.filter(o=>o.id!==orderId);
            saveOrders();
            renderAll();
        }
        return;
    }
});

function renderTransferPanel(order){

    const buildTotalHtml=()=>{

    };

    const buildDispatchText=()=>{
        const groups=order.transferGroups||[];
        const latest=groups.length>0?groups[groups.length-1]:null;
        const extraText=latest&&latest.desc?latest.desc:(order.extra||'');
        const dispatchId=buildDispatchOrderId(order.id,groups.length||1);
        return [
            `派单编号：${dispatchId}`,
            `派单客服：${order.customerService||''}`,
            `老板昵称：${order.bossNickname||''}`,
            `派单类型：${order.type||''}`,
            `预计人数：${order.expectedPeople||''}`,
            `需求补充：${extraText}`

    panelContainer.innerHTML=`

                    <div class="dispatch-preview" id="dispatch-preview">${buildDispatchText().replace(/</g,'&lt;')}</div>
                </div>
                <div class="actions-panel">
                    <button class="btn btn-outline" id="transfer-cancel">取消</button>
                    <button class="btn btn-primary" id="transfer-save">保存转单记录</button>
                </div>
            </div>
        </div>
    `;

    const refreshTotals=()=>{
        const groups=collectGroupsFromPanel();
        order.transferGroups=groups;
        document.querySelectorAll('.transfer-group').forEach((el,index)=>{
            const g=groups[index];
            const count=toNumber(g.count)||1;

        });
        const totalWrapper=document.getElementById('transfer-total-wrapper');
        if(totalWrapper) totalWrapper.innerHTML=buildTotalHtml();
        const preview=document.getElementById('dispatch-preview');
        if(preview) preview.textContent=buildDispatchText();
    };

    document.getElementById('close-transfer-btn').addEventListener('click',closePanel);
    document.getElementById('transfer-cancel').addEventListener('click',closePanel);
    document.getElementById('transfer-overlay').addEventListener('click',e=>{
        if(e.target.id==='transfer-overlay') closePanel();
    });

    document.getElementById('btn-add-group').addEventListener('click',()=>{
        const currentGroups=collectGroupsFromPanel();
        currentGroups.push({player1:'',player2:'',count:'1',fee:'0',desc:''});
        order.transferGroups=currentGroups;
        renderTransferPanel(order);
    });

    document.querySelectorAll('[data-action="remove-group"]').forEach(btn=>{
        btn.addEventListener('click',e=>{
            e.stopPropagation();
            const groupEl=btn.closest('.transfer-group');
            const idx=parseInt(groupEl.dataset.groupIndex);
            const currentGroups=collectGroupsFromPanel();
            currentGroups.splice(idx,1);
            order.transferGroups=currentGroups;
            renderTransferPanel(order);
        });
    });

    document.querySelectorAll('[data-group-field="player1"], [data-group-field="player2"]').forEach(inp=>{
        inp.addEventListener('input',function(){
            const groupEl=this.closest('.transfer-group');
            const countInput=groupEl.querySelector('[data-group-field="count"]');
            if(!countInput) return;
            const p1=groupEl.querySelector('[data-group-field="player1"]').value;
            const p2=groupEl.querySelector('[data-group-field="player2"]').value;
            const auto=autoCountFromPlayers(p1,p2);
            countInput.value=auto;
            refreshTotals();
        });
    });

    document.querySelectorAll('[data-group-field="count"], [data-group-field="fee"], [data-group-field="desc"]').forEach(inp=>{
        inp.addEventListener('input',refreshTotals);
    });

    document.getElementById('btn-dispatch-copy').addEventListener('click',()=>{
        const groups=collectGroupsFromPanel();
        order.transferGroups=groups;
        const latest=groups.length>0?groups[groups.length-1]:null;
        const extraText=latest&&latest.desc?latest.desc:'';
        if(extraText) order.extra=extraText;
        const dispatchText=buildDispatchText();
        saveOrders();
        renderAll();

        const done=(ok)=>{
            const btn=document.getElementById('btn-dispatch-copy');
            if(!btn) return;
            btn.textContent=ok?'✅ 已复制派单条':'❌ 复制失败';
            setTimeout(()=>{if(btn) btn.textContent='📋 转单派单条（复制）';},1500);
        };

        if(navigator.clipboard&&navigator.clipboard.writeText){
            navigator.clipboard.writeText(dispatchText).then(()=>done(true)).catch(()=>{
                const ta=document.createElement('textarea');
                ta.value=dispatchText;
                document.body.appendChild(ta);
                ta.select();
                try{document.execCommand('copy');done(true);}catch(e){done(false);}
                document.body.removeChild(ta);
            });
        }else{
            const ta=document.createElement('textarea');
            ta.value=dispatchText;
            document.body.appendChild(ta);
            ta.select();
            try{document.execCommand('copy');done(true);}catch(e){done(false);}
            document.body.removeChild(ta);
        }
    });

    document.getElementById('transfer-save').addEventListener('click',()=>{
        const currentGroups=collectGroupsFromPanel();
        currentGroups.forEach(g=>{
            g.count=autoCountFromPlayers(g.player1,g.player2);
        });
        order.transferGroups=currentGroups;
        if(currentGroups.length>0){
            const last=currentGroups[currentGroups.length-1];
            order.assignee1=last.player1||'';
            order.assignee2=last.player2||'';
        }
        saveOrders();
        closePanel();
        renderAll();
    });

    function collectGroupsFromPanel(){
        const groups=[];
        document.querySelectorAll('.transfer-group').forEach(el=>{
            const player1=el.querySelector('[data-group-field="player1"]')?.value.trim()||'';
            const player2=el.querySelector('[data-group-field="player2"]')?.value.trim()||'';
            const count=el.querySelector('[data-group-field="count"]')?.value.trim()||'1';
            const fee=el.querySelector('[data-group-field="fee"]')?.value.trim()||'0';
            const desc=el.querySelector('[data-group-field="desc"]')?.value.trim()||'';
            groups.push({player1,player2,count,fee,desc});
        });
        return groups;
    }
}

/* ============ 创建/编辑面板 ============ */
function openCreatePanel(){
    editingOrderId=null;
    const newId=generateNewId();
    const timeStr=formatDate(new Date());
    renderPanel({
        id:newId,customerService:'',bossNickname:'',type:'',expectedPeople:'',extra:'',
        assignee1:'',assignee2:'',status:'pending',bossWaiting:true,bossFinished:false,
        urgent:false,createTime:timeStr,transferGroups:[]
    },'create');
}

function openEditPanel(orderId){
    const order=orders.find(o=>o.id===orderId);
    if(!order) return;
    editingOrderId=orderId;
    renderPanel({...order},'edit');
}

function renderPanel(data,mode='create'){
    const isEdit=mode==='edit';
    const title=isEdit?'编辑订单':'创建订单';

    panelContainer.innerHTML=`
        <div class="panel-overlay" id="panel-overlay">
            <div class="panel">
                <h3>${title} <button class="close-panel" id="close-panel-btn">&times;</button></h3>

                <div class="paste-area">
                    <label>📋 一键粘贴解析</label>
                    <textarea id="paste-textarea" placeholder="粘贴格式示例：&#10;派单编号：1118-26&#10;派单客服：薯片&#10;老板昵称：姜尚真&#10;派单类型：环游航天288/1288-/--288&#10;预计人数：2人&#10;需求补充：优先处理"></textarea>
                    <div class="hint">支持「字段：值」每行一个，自动填充下方表单</div>
                    <button class="btn btn-outline btn-paste-apply" id="btn-apply-paste">解析并填充</button>
                </div>

                <div class="row-2col">
                    <div class="field"><label>派单编号</label><input type="text" id="field-id" value="${data.id||''}" ${isEdit?'readonly':''}></div>
                    <div class="field"><label>派单客服</label><input type="text" id="field-cs" value="${data.customerService||''}"></div>
                </div>
                <div class="row-2col">
                    <div class="field"><label>老板昵称</label><input type="text" id="field-boss" value="${data.bossNickname||''}"></div>
                    <div class="field"><label>预计人数</label><input type="text" id="field-people" value="${data.expectedPeople||''}"></div>
                </div>
                <div class="field"><label>派单类型</label><input type="text" id="field-type" value="${data.type||''}"></div>
                <div class="field"><label>需求补充</label><textarea id="field-extra">${data.extra||''}</textarea></div>
                <div class="row-2col">
                    <div class="field"><label>接单人1</label><input type="text" id="field-assignee1" value="${data.assignee1||''}" placeholder="姓名"></div>
                    <div class="field"><label>接单人2</label><input type="text" id="field-assignee2" value="${data.assignee2||''}" placeholder="可选"></div>
                </div>
                <div class="checkbox-row">
                    <input type="checkbox" id="field-boss-waiting" ${data.bossWaiting!==false?'checked':''}>
                    <label for="field-boss-waiting">老板等待中（取消勾选则不在线）</label>
                </div>
                <div class="actions-panel">
                    <button class="btn btn-outline" id="panel-cancel">取消</button>
                    <button class="btn btn-primary" id="panel-save">${isEdit?'保存修改':'创建订单'}</button>
                </div>
            </div>
        </div>
    `;

    document.getElementById('close-panel-btn').addEventListener('click',closePanel);
    document.getElementById('panel-cancel').addEventListener('click',closePanel);
    document.getElementById('panel-overlay').addEventListener('click',e=>{
        if(e.target.id==='panel-overlay') closePanel();
    });

    document.getElementById('btn-apply-paste').addEventListener('click',()=>{
        const text=document.getElementById('paste-textarea').value;
        const parsed=parsePasteText(text);
        if(parsed){
            if(parsed.id) document.getElementById('field-id').value=parsed.id;
            if(parsed.customerService) document.getElementById('field-cs').value=parsed.customerService;
            if(parsed.bossNickname) document.getElementById('field-boss').value=parsed.bossNickname;
            if(parsed.type) document.getElementById('field-type').value=parsed.type;
            if(parsed.expectedPeople) document.getElementById('field-people').value=parsed.expectedPeople;
            if(parsed.extra) document.getElementById('field-extra').value=parsed.extra;
            if(parsed.assignee1) document.getElementById('field-assignee1').value=parsed.assignee1;
            if(parsed.assignee2) document.getElementById('field-assignee2').value=parsed.assignee2;
        }
    });

    document.getElementById('panel-save').addEventListener('click',()=>{
        const newData={
            id:document.getElementById('field-id').value.trim(),
            customerService:document.getElementById('field-cs').value.trim(),
            bossNickname:document.getElementById('field-boss').value.trim(),
            type:document.getElementById('field-type').value.trim(),
            expectedPeople:document.getElementById('field-people').value.trim(),
            extra:document.getElementById('field-extra').value.trim(),
            assignee1:document.getElementById('field-assignee1').value.trim(),
            assignee2:document.getElementById('field-assignee2').value.trim(),
            bossWaiting:document.getElementById('field-boss-waiting').checked
        };

        if(!newData.id){alert('派单编号不能为空');return;}

        if(isEdit){
            const index=orders.findIndex(o=>o.id===editingOrderId);
            if(index!==-1){
                orders[index]={...orders[index],...newData};
            }
        }else{
            if(orders.some(o=>o.id===newData.id)){alert('派单编号已存在，请修改');return;}
            orders.push({
                ...newData,status:'pending',bossFinished:false,urgent:false,
                createTime:formatDate(new Date()),transferGroups:[]
            });
        }

        saveOrders();
        closePanel();
        renderAll();
    });

    setTimeout(()=>{
        const firstInput=document.getElementById('field-id');
        if(firstInput&&!isEdit) firstInput.focus();
    },100);
}

function closePanel(){
    panelContainer.innerHTML='';
    editingOrderId=null;
}

function parsePasteText(text){
    const result={};
    text.split('\n').forEach(line=>{
        line=line.trim();
        if(!line) return;
        const colonIndex=line.search(/[:：]/);
        if(colonIndex===-1) return;
        let key=line.substring(0,colonIndex).trim().replace(/^\d+[\.、\s]*/,'');
        let value=line.substring(colonIndex+1).trim();
        if(key.includes('派单编号')||key.toLowerCase().includes('id')) result.id=value;
        else if(key.includes('派单客服')||key.includes('客服')) result.customerService=value;
        else if(key.includes('老板昵称')||key.includes('老板')) result.bossNickname=value;
        else if(key.includes('派单类型')||key.includes('类型')) result.type=value;
        else if(key.includes('预计人数')||key.includes('人数')) result.expectedPeople=value;
        else if(key.includes('需求补充')||key.includes('补充')||key.includes('备注')) result.extra=value;
        else if(key.includes('接单人1')||key.includes('接单人一')) result.assignee1=value;
        else if(key.includes('接单人2')||key.includes('接单人二')) result.assignee2=value;
    });
    return Object.keys(result).length>0?result:null;
}

/* ============ 导出 ============ */
function exportPendingOrders(){
    const pendingOrders=sortOrders(orders.filter(o=>o.status==='pending'));
    if(pendingOrders.length===0){alert('暂无待接单订单可导出');return;}

    const DIVIDER='------------------------------------';
    let output='———————蛋表———————\n';

    pendingOrders.forEach((order,index)=>{
        output+=order.urgent?'                       ❗️加急\n':'                      ✅️待接\n';
        output+=`派单编号：${order.id}\n`;
        output+=`派单客服：${order.customerService}\n`;
        output+=`老板昵称：${order.bossNickname}\n`;
        output+=`派单类型：${order.type}\n`;
        output+=`预计人数：${order.expectedPeople}\n`;
        output+=`需求补充：${order.extra||''}\n`;
        if(index<pendingOrders.length-1) output+=DIVIDER+'\n';
    });

    showExportPanel(output,pendingOrders);
}

function showExportPanel(text,pendingOrders){
    let previewHtml='';
    const DIVIDER='------------------------------------';
    pendingOrders.forEach((order,index)=>{
        previewHtml+=order.urgent?'<div class="export-urgent-highlight">❗️加急</div>':'<div class="export-normal-highlight">✅️待接</div>';
        previewHtml+=`派单编号：${order.id}<br>`;
        previewHtml+=`派单客服：${order.customerService}<br>`;
        previewHtml+=`老板昵称：${order.bossNickname}<br>`;
        previewHtml+=`派单类型：${order.type}<br>`;
        previewHtml+=`预计人数：${order.expectedPeople}<br>`;
        previewHtml+=`需求补充：${order.extra||''}<br>`;
        if(index<pendingOrders.length-1) previewHtml+=DIVIDER+'<br>';
    });

    exportContainer.innerHTML=`
        <div class="panel-overlay" id="export-overlay">
            <div class="panel" style="max-width:760px;">
                <h3>📤 蛋表导出 <button class="close-panel" id="close-export-btn">&times;</button></h3>
                <div class="field">
                    <label>导出内容预览 <span style="color:#e63946;font-size:.75rem;font-weight:400;">（红色为加急，绿色为待接）</span></label>
                    <div style="background:#f8fafc;border:1px solid #cfddee;border-radius:12px;padding:14px 16px;max-height:400px;overflow-y:auto;font-family:'SF Mono','Menlo',monospace;font-size:.82rem;line-height:1.8;color:#1a2b4c;">${previewHtml}</div>
                </div>
                <div class="actions-panel" style="justify-content:space-between;">
                    <span class="hint" style="color:#8a9bb2;font-size:.8rem;">共 ${pendingOrders.length} 个待接单${pendingOrders.filter(o=>o.urgent).length>0?`，其中 ${pendingOrders.filter(o=>o.urgent).length} 个加急`:''}</span>
                    <div style="display:flex;gap:10px;">
                        <button class="btn btn-outline" id="btn-copy-export">📋 复制内容</button>
                        <button class="btn btn-primary" id="btn-download-export">⬇ 下载 .txt</button>
                    </div>
                </div>
            </div>
        </div>
    `;

    document.getElementById('close-export-btn').addEventListener('click',()=>{exportContainer.innerHTML='';});
    document.getElementById('export-overlay').addEventListener('click',e=>{
        if(e.target.id==='export-overlay') exportContainer.innerHTML='';
    });

    document.getElementById('btn-copy-export').addEventListener('click',()=>{
        navigator.clipboard.writeText(text).then(()=>{
            const btn=document.getElementById('btn-copy-export');
            btn.textContent='✅ 已复制';
            setTimeout(()=>{btn.textContent='📋 复制内容';},1500);
        }).catch(()=>{
            const ta=document.createElement('textarea');
            ta.value=text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            const btn=document.getElementById('btn-copy-export');
            btn.textContent='✅ 已复制';
            setTimeout(()=>{btn.textContent='📋 复制内容';},1500);
        });
    });

    document.getElementById('btn-download-export').addEventListener('click',()=>{
        const blob=new Blob([text],{type:'text/plain;charset=utf-8'});
        const url=URL.createObjectURL(blob);
        const a=document.createElement('a');
        a.href=url;
        a.download=`蛋表_${formatDate(new Date()).replace(/[: ]/g,'_')}.txt`;
        a.click();
        URL.revokeObjectURL(url);
    });
}

/* ============ 重置全部（双重确认） ============ */
function resetAllOrders(){
    if(orders.length===0){alert('当前没有任何订单，无需重置。');return;}

    const firstConfirm=confirm(
        `⚠️ 警告：即将删除所有 ${orders.length} 个订单！\n\n`+
        `此操作将清空全部待接单、进行中、已结束和弃单，且不可恢复。\n\n`+
        `点击“确定”继续，点击“取消”放弃。`
    );
    if(!firstConfirm) return;

    const secondConfirm=confirm(
        `🔥 最后确认：真的要清空全部 ${orders.length} 个订单吗？\n\n`+
        `请再次点击“确定”，数据将永久删除。`
    );
    if(!secondConfirm) return;

    orders=[];
    saveOrders();
    renderAll();
    alert('✅ 所有订单已重置。');
}

/* ============ 初始化 ============ */
renderAll();

document.getElementById('btn-create').addEventListener('click',openCreatePanel);
document.getElementById('btn-export').addEventListener('click',exportPendingOrders);
document.getElementById('btn-reset').addEventListener('click',resetAllOrders);

window.addEventListener('keydown',e=>{
    if(e.key==='Escape'){
        if(panelContainer.innerHTML) closePanel();
        if(exportContainer.innerHTML) exportContainer.innerHTML='';
    }
});
